<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نتائج قرعة الحج والعمرة - مكتب ذي قار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5ecdd;
  --bg2:#ecdcc2;
  --card:#fffaf1;
  --ink:#3a2415;
  --ink-soft:#8a6a4e;
  --green:#7a4423;
  --green-deep:#4a2a14;
  --gold:#b9782f;
  --gold-soft:#e9c896;
  --line:rgba(122,68,35,.18);
  --shadow:0 10px 30px -14px rgba(74,42,20,.35);
  --radius:18px;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark){
    --bg:#1b120a;
    --bg2:#140d07;
    --card:#251910;
    --ink:#f3e6d3;
    --ink-soft:#c2a483;
    --green:#cc8f52;
    --green-deep:#2c1c10;
    --gold:#e0a75e;
    --gold-soft:#3d2c19;
    --line:rgba(255,255,255,.09);
    --shadow:0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1b120a;--bg2:#140d07;--card:#251910;--ink:#f3e6d3;--ink-soft:#c2a483;
  --green:#cc8f52;--green-deep:#2c1c10;--gold:#e0a75e;--gold-soft:#3d2c19;
  --line:rgba(255,255,255,.09);--shadow:0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  background:
    radial-gradient(1200px 600px at 100% -10%, var(--gold-soft) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  color:var(--ink);
  font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100%;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 60px;}

.pattern{
  height:10px;
  background-image: repeating-linear-gradient(135deg, var(--gold) 0 8px, transparent 8px 16px);
  opacity:.55; border-radius:8px; margin-bottom:22px;
}

header.top{ text-align:center; padding:6px 0 22px; }
.icon{
  width:58px;height:58px;margin:0 auto 12px;display:block;
  filter:drop-shadow(0 6px 14px rgba(15,76,58,.35));
}
h1{
  font-family:'Amiri','Tajawal',serif;
  font-size:clamp(24px,6vw,32px);
  font-weight:700; margin:0 0 6px; color:var(--green-deep);
}
@media (prefers-color-scheme: dark){ h1{color:#f6e6ce;} }
:root[data-theme="dark"] h1{color:#f6e6ce;}
.sub{ color:var(--ink-soft); font-size:15px; margin:0; font-weight:500;}
.stat-row{
  display:flex; justify-content:center; gap:10px; margin-top:16px; flex-wrap:wrap;
}
.stat{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:8px 14px; font-size:13px; font-weight:700; color:var(--green);
  box-shadow:var(--shadow); display:inline-flex; align-items:center; gap:6px;
}
.stat b{ color:var(--gold); font-weight:800; }
.stat-ic{ width:15px; height:15px; flex:none; }
.badge{ display:inline-flex; align-items:center; gap:4px; }
.badge svg{ width:11px; height:11px; flex:none; }

.searchbox{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; box-shadow:var(--shadow); margin-bottom:16px;
}
.searchfield{ position:relative; }
.searchfield svg{
  position:absolute; inset-inline-start:14px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; color:var(--ink-soft); pointer-events:none;
}
.searchbox input[type="text"]{
  width:100%; padding:14px 44px 14px 16px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--bg); color:var(--ink); font-family:inherit; font-size:16px;
  outline:none; transition:border-color .15s;
}
.searchbox input[type="text"]:focus{ border-color:var(--green); }
.filters{ display:flex; gap:10px; margin-top:10px; }
.filters select{
  flex:1; padding:12px 10px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--bg); color:var(--ink); font-family:inherit; font-size:15px; font-weight:600;
}
.hint{ font-size:12.5px; color:var(--ink-soft); margin:10px 2px 0; text-align:center; }

.results-meta{
  display:flex; justify-content:space-between; align-items:center;
  margin:4px 4px 12px; color:var(--ink-soft); font-size:13.5px; font-weight:600;
}

#list{ display:flex; flex-direction:column; gap:10px; }
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:14px 16px; box-shadow:var(--shadow);
  position:relative; overflow:hidden;
}
.card::before{
  content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px;
  background:linear-gradient(180deg,var(--green),var(--gold));
}
.card .name{ font-size:16.5px; font-weight:800; color:var(--ink); margin:0 0 8px; line-height:1.4;}
.badges{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
.badge{
  font-size:12px; font-weight:700; padding:4px 10px; border-radius:100px;
  background:var(--bg); border:1px solid var(--line); color:var(--green);
}
.badge.gold{ color:var(--gold); }
.pairbox{
  margin-top:10px; display:flex; align-items:center; gap:10px;
  background:linear-gradient(135deg, var(--gold-soft), transparent 75%);
  border:1px solid var(--line); border-radius:12px; padding:9px 12px;
}
.pairbox .rings{ width:26px; height:26px; flex:none; color:var(--gold); }
.pairbox .txt{ min-width:0; }
.pairbox .lbl{ font-size:10.5px; font-weight:700; color:var(--gold); letter-spacing:.2px; }
.pairbox .cname{ font-size:14px; font-weight:800; color:var(--ink); margin-top:1px; overflow-wrap:anywhere; }

.empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
.empty svg{ width:44px;height:44px;opacity:.5;margin-bottom:10px; }

.loadmore{
  display:block; margin:18px auto 0; padding:12px 26px; border-radius:100px;
  background:var(--green); color:#fff; border:none; font-family:inherit;
  font-weight:700; font-size:14.5px; cursor:pointer; box-shadow:var(--shadow);
}
.loadmore:active{ transform:scale(.97); }

footer{ text-align:center; margin-top:34px; color:var(--ink-soft); font-size:12px; }

@media (max-width:400px){
  .filters{ flex-direction:column; }
}
</style>
</head>
<body>
<div class="wrap">

  <div class="searchbox">

      <input type="text" id="q" placeholder="ابحث بالاسم، اسم المرافق، أو الرقم..." autocomplete="off" inputmode="search">

  </div>

  <div class="results-meta">
    <span id="countLabel">—</span>
    <span id="modeLabel"></span>
  </div>

  <div id="list"></div>
  <button class="loadmore" id="loadMoreBtn" style="display:none">عرض المزيد</button>
  <div class="empty" id="emptyState" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <div>لا توجد نتائج مطابقة</div>
  </div>

  <footer>يعرض هذا الموقع بيانات الفائزين في قرعة الحج والعمرة لمكتب ذي قار</footer>
</div>

const PAGE_SIZE = 24;
let filtered = DATA;
let shown = 0;

function normalize(s){
  if(!s) return "";
  return s
    .replace(/[\u064B-\u0652\u0670\u0640]/g,"")
    .replace(/[إأآا]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ة/g,"ه")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .trim().toLowerCase();
}

const yearCounts = {};
DATA.forEach(r=>{ yearCounts[r.y] = (yearCounts[r.y]||0)+1; });
const yearSel = document.getElementById("yearFilter");
Object.keys(yearCounts).sort().forEach(y=>{
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = `سنة ${y} (${yearCounts[y]})`;
  yearSel.appendChild(opt);
});

document.getElementById("statRow").innerHTML = `
  <div class="stat"><svg class="stat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> إجمالي الفائزين <b>${DATA.length.toLocaleString('ar')}</b></div>
  <div class="stat"><svg class="stat-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg> عدد السنوات <b>${Object.keys(yearCounts).length}</b></div>
`;

function render(){
  const list = document.getElementById("list");
  const toShow = filtered.slice(0, shown);
  list.innerHTML = toShow.map(r=>{
    const crescentIc = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 3a9 9 0 1 0 0 18c1.4 0 2.7-.3 3.9-.9-4-1-6.9-4.6-6.9-8.9s2.9-7.9 6.9-8.9C16.7 3.3 15.4 3 14 3z"/></svg>`;
    const starIc = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z"/></svg>`;
    const badges = `<span class="badge">${crescentIc}سنة ${r.y}</span>` + (r.b?`<span class="badge gold">${starIc}مواليد ${r.b}</span>`:"");
    const comp = r.c ? `<div class="pairbox">
        <svg class="rings" viewBox="0 0 40 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="15" cy="12" r="9" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="25" cy="12" r="9" stroke="currentColor" stroke-width="2.5"/>
        </svg>
        <div class="txt"><div class="lbl">المرافق</div><div class="cname">${escapeHtml(r.c)}</div></div>
      </div>` : "";
    return `<div class="card">
      <p class="name">${escapeHtml(r.n)}</p>
      <div class="badges">${badges}</div>
      ${comp}
    </div>`;
  }).join("");

  document.getElementById("countLabel").textContent = `عدد النتائج: ${filtered.length.toLocaleString('ar')}`;
  document.getElementById("emptyState").style.display = filtered.length === 0 ? "block" : "none";
  document.getElementById("loadMoreBtn").style.display = shown < filtered.length ? "block" : "none";
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function applyFilter(){
  const qRaw = document.getElementById("q").value.trim();
  const year = document.getElementById("yearFilter").value;
  const isNumeric = /^[0-9\u0660-\u0669]+$/.test(qRaw);
  const q = normalize(qRaw).replace(/[\u0660-\u0669]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));

  filtered = DATA.filter(r=>{
    if(year && r.y !== year) return false;
    if(!qRaw) return true;
    if(isNumeric){
      return r.r.includes(qRaw);
    }
    return normalize(r.n).includes(q) || normalize(r.c).includes(q);
  });
  shown = Math.min(PAGE_SIZE, filtered.length);
  render();
}

document.getElementById("q").addEventListener("input", applyFilter);
document.getElementById("yearFilter").addEventListener("change", applyFilter);
document.getElementById("loadMoreBtn").addEventListener("click", ()=>{
  shown = Math.min(shown + PAGE_SIZE, filtered.length);
  render();
});

shown = Math.min(PAGE_SIZE, filtered.length);
render();
</script>
